<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Dublin Gym Finder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container" style="max-width: 400px;">
        <h1 class="h4 mt-5 mb-3">Sign up</h1>

        <form method="post" action="{% url 'frontend:signup' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>

        <p class="mt-3 small">Already have an account? <a href="{% url 'login' %}">Log in</a> · <a href="/">Back to map</a></p>
    </main>
</body>
</html>
