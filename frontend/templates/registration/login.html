{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Dublin Gym Finder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container" style="max-width: 400px;">
        <h1 class="h4 mt-5 mb-3">Log in</h1>

        {% if form.errors %}
            <div class="alert alert-danger" role="alert">Your username and password didn't match. Please try again.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="mt-3 small">No account? <a href="{% url 'frontend:signup' %}">Sign up</a> · <a href="/">Back to map</a></p>
    </main>
</body>
</html>
