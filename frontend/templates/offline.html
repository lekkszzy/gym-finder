<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212529">
    <title>Offline - Dublin Gym Finder</title>
    <!-- Styles are inline so this page still looks right with no network at all -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #212529;
            color: #f8f9fa;
            text-align: center;
            padding: 1rem;
        }
        .card { max-width: 360px; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #adb5bd; line-height: 1.5; }
        button {
            margin-top: 1rem;
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 0.375rem;
            background: #0d6efd;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>You're offline</h1>
        <p>Dublin Gym Finder can't reach the internet right now. Pages and gyms you've already
           viewed are still available. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
