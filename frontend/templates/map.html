{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Send Referer to tile servers (OSM blocks requests without it) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Dublin Gym Finder</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
              <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Dublin Gym Finder</span>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 mb-0">
                {% csrf_token %}
                <span class="navbar-text text-light">{{ user.username }}</span>
                <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
            </form>
        {% else %}
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}?next=/">Log in</a>
                <a class="btn btn-light btn-sm" href="{% url 'frontend:signup' %}">Sign up</a>
            </div>
        {% endif %}
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <aside class="col-md-4 col-lg-3 sidebar p-3" aria-label="Search controls">

                <!-- Near me -->
                <h2 class="h6">Near me</h2>
                <button id="locateBtn" class="btn btn-primary btn-sm w-100 mb-2" type="button">Use my location</button>
                <p class="small text-muted mb-2">Or click anywhere on the map to set a search point.</p>

                <label for="radius" class="form-label">Radius: <strong id="radiusValue">5</strong> km</label>
                <input type="range" id="radius" class="form-range" min="1" max="50" value="5">

                <div class="d-flex gap-2 mb-3">
                    <button id="nearestBtn" class="btn btn-outline-primary btn-sm flex-fill" type="button">Find nearest</button>
                    <button id="radiusBtn" class="btn btn-outline-primary btn-sm flex-fill" type="button">Search radius</button>
                </div>

                <!-- Areas -->
                <h2 class="h6">Gyms in an area</h2>
                <label for="areaSelect" class="visually-hidden">Choose an area</label>
                <select id="areaSelect" class="form-select form-select-sm mb-3">
                    <option value="">Choose an area...</option>
                </select>

                <!-- Routes -->
                <h2 class="h6">Gyms along a route</h2>
                <label for="routeSelect" class="visually-hidden">Choose a route</label>
                <select id="routeSelect" class="form-select form-select-sm mb-2">
                    <option value="">Choose a route...</option>
                </select>
                <label for="buffer" class="form-label small">Distance from route (m)</label>
                <input type="number" id="buffer" class="form-control form-control-sm mb-3" min="1" max="5000" value="500">

                <button id="resetBtn" class="btn btn-secondary btn-sm w-100 mb-3" type="button">Show all gyms</button>

                <!-- Results -->
                <h2 class="h6">Results <span id="resultCount" class="badge bg-secondary">0</span></h2>
                <div id="message" class="small text-danger mb-2" role="alert"></div>
                <ul id="results" class="list-group list-group-flush small"></ul>
            </aside>

            <!-- Map -->
            <main class="col-md-8 col-lg-9 p-0">
                <div id="map" role="region" aria-label="Map of gyms"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Custom Map Script -->
    <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
